version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: src/EnterpriseCRM.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db.ehmjgxwrmzlccnivqqxb.supabase.co;Port=5432;Database=postgres;Username=postgres;Password=${SUPABASE_DB_PASSWORD};SSL Mode=Require;Trust Server Certificate=true;
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
